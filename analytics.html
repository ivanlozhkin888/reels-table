<style>
:root{--bg:#f6f7f5;--panel:#fff;--fg:#1c2421;--muted:#5f6b66;--line:#dfe4e1;--accent:#0f6e5c;--accent-soft:#e1f0ec;--hot:#b4471f;--hot-soft:#f8e6dd;--display:"Unbounded",system-ui,sans-serif;--body:"Onest",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121816;--panel:#19211e;--fg:#e4ebe8;--muted:#93a29c;--line:#2b3632;--accent:#5cc4ad;--accent-soft:#1d3a33;--hot:#ef8a62;--hot-soft:#3a251c;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--body);padding:24px 16px 48px}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
nav a{color:var(--accent);font-weight:600;text-decoration:none}
h1{font:700 clamp(22px,3.4vw,30px)/1.15 var(--display);margin:6px 0 0}
.sub{color:var(--muted);margin:6px 0 0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;text-align:left;font:inherit;color:inherit;display:flex;flex-direction:column;gap:12px}
.card[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.card h2{font:600 17px var(--body);margin:0;display:flex;justify-content:space-between;gap:8px}
.card h2 small{font:500 12px var(--mono);color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi b{display:block;font:700 22px/1.1 var(--display);font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.rec{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.rec strong{color:var(--fg)}
.more{color:var(--accent);font-weight:600;font-size:13px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:18px}
.panel h3{font:600 16px var(--body);margin:0}
table{border-collapse:collapse;width:100%}
th{text-align:left;font:600 11px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.hot{color:var(--hot);font-weight:600}
.bars{display:flex;align-items:flex-end;gap:6px;height:120px;padding-top:6px}
.bar{flex:1;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.bar i{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font:500 10px var(--mono);color:var(--muted);font-style:normal;white-space:nowrap}
.barlbl{display:flex;gap:6px}.barlbl span{flex:1;text-align:center;font:500 10px var(--mono);color:var(--muted)}
.src{font-size:13px}.src a{color:var(--accent)}
.tag{display:inline-block;font:600 11px var(--body);padding:2px 8px;border-radius:999px;background:var(--hot-soft);color:var(--hot)}
.tablebox{overflow-x:auto}
.empty{color:var(--muted);font-style:italic}
@media (max-width:640px){.hide-m{display:none}td,th{padding:8px 6px}}
